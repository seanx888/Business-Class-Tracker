name: Daily fare scan & deploy

on:
  schedule:
    - cron: '40 21 * * *' # 05:40 Taipei time (UTC+8) every day
  workflow_dispatch:
    inputs:
      provider:
        description: 'Force provider: serpapi | duffel | demo (blank = auto from secrets)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests (China-exclusion filter, scoring, providers)
        run: npm test

      - name: Scan business-class fares
        if: github.event_name != 'push'
        env:
          FARE_PROVIDER: ${{ inputs.provider || vars.FARE_PROVIDER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_VERIFY_RETURN: ${{ vars.SERPAPI_VERIFY_RETURN }}
          SERPAPI_DEEP_SEARCH: ${{ vars.SERPAPI_DEEP_SEARCH }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          SEARCHES_PER_RUN: ${{ vars.SEARCHES_PER_RUN }}
          NOTIFY_MIN_SCORE: ${{ vars.NOTIFY_MIN_SCORE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/scan.mjs

      - name: Commit fare data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: fare scan $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
