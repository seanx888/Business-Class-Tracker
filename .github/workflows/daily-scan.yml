name: Daily fare scan & deploy

# The app is hosted on Vercel and reads fare data straight from this repo (web/data/),
# so the daily scan only needs to commit data — no deploy step, no Vercel token.
# Optional repository variable DEPLOY_TARGET: none (default) · pages · vercel · pages,vercel
on:
  schedule:
    - cron: '40 21 * * *' # 05:40 Taipei time (UTC+8) every day
  workflow_dispatch:
    inputs:
      provider:
        description: 'Force provider: serpapi | duffel | demo (blank = auto from secrets)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan-and-deploy
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'none' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests (China-exclusion filter, scoring, providers)
        run: npm test

      # Catches the usual setup slips: key saved as a Variable, wrong tab, or not saved at all.
      # Only true/false is printed — never the values.
      - name: Check secrets
        if: github.event_name != 'push'
        env:
          HAS_SERPAPI_SECRET: ${{ secrets.SERPAPI_KEY != '' || secrets.SERPAPI_API_KEY != '' }}
          HAS_NTFY_SECRET: ${{ secrets.NTFY_TOPICS != '' || secrets.NTFY_TOPIC != '' }}
          SERPAPI_SAVED_AS_VARIABLE: ${{ vars.SERPAPI_KEY != '' || vars.SERPAPI_API_KEY != '' }}
          NTFY_SAVED_AS_VARIABLE: ${{ vars.NTFY_TOPICS != '' || vars.NTFY_TOPIC != '' }}
        run: |
          if [ "$SERPAPI_SAVED_AS_VARIABLE" = "true" ]; then
            echo "::error title=SERPAPI_KEY is saved as a Variable::Variables are not secret and are not used. Delete it under Variables and add it under Settings → Secrets and variables → Actions → Secrets → New repository secret."
          fi
          if [ "$HAS_SERPAPI_SECRET" != "true" ]; then
            echo "::warning title=No SERPAPI_KEY repository secret::This run uses DEMO data. Add it under Settings → Secrets and variables → Actions → Secrets tab → Repository secrets → New repository secret, Name: SERPAPI_KEY. A key saved under Environment secrets, as a Variable, or in Vercel is not visible to this workflow."
          fi
          if [ "$NTFY_SAVED_AS_VARIABLE" = "true" ]; then
            echo "::error title=NTFY_TOPICS is saved as a Variable::Anyone who knows an ntfy topic can read it — store it as a Secret instead."
          fi
          if [ "$HAS_NTFY_SECRET" != "true" ]; then
            echo "::notice title=No NTFY_TOPICS secret::Push notifications stay off until NTFY_TOPICS is set as a secret."
          fi

      - name: Scan business-class fares
        if: github.event_name != 'push'
        env:
          FARE_PROVIDER: ${{ inputs.provider || vars.FARE_PROVIDER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.SERPAPI_API_KEY }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_VERIFY_RETURN: ${{ vars.SERPAPI_VERIFY_RETURN }}
          SERPAPI_DEEP_SEARCH: ${{ vars.SERPAPI_DEEP_SEARCH }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          SEARCHES_PER_RUN: ${{ vars.SEARCHES_PER_RUN }}
          WATCH_TRIPS: ${{ vars.WATCH_TRIPS }}
          PRICE_ALERTS: ${{ vars.PRICE_ALERTS }}
          NOTIFY_MIN_SCORE: ${{ vars.NOTIFY_MIN_SCORE }}
          NOTIFICATIONS: ${{ vars.NOTIFICATIONS }}
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS || secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/scan.mjs

      - name: Commit fare data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: fare scan $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ── GitHub Pages ──
      - if: contains(env.DEPLOY_TARGET, 'pages')
        uses: actions/configure-pages@v5
      - if: contains(env.DEPLOY_TARGET, 'pages')
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      # ── Vercel (direct upload of web/, no Git integration needed) ──
      - name: Deploy to Vercel
        if: contains(env.DEPLOY_TARGET, 'vercel')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'business-class-tracker' }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::DEPLOY_TARGET includes vercel but secret VERCEL_TOKEN is missing"; exit 1; fi
          SITE="$RUNNER_TEMP/$VERCEL_PROJECT"
          rm -rf "$SITE" && mkdir -p "$SITE" && cp -r web/. "$SITE/"
          cd "$SITE"
          SCOPE_ARGS=()
          if [ -n "$VERCEL_SCOPE" ]; then SCOPE_ARGS=(--scope "$VERCEL_SCOPE"); fi
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" "${SCOPE_ARGS[@]}"
          URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" "${SCOPE_ARGS[@]}")
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: build
    if: contains(vars.DEPLOY_TARGET || 'none', 'pages')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
