name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Demo scan smoke test
        run: OFFLINE=1 FARE_PROVIDER=demo node scripts/scan.mjs
      - name: Community feed smoke test (offline fixtures)
        run: COMMUNITY_OFFLINE=1 OFFLINE=1 node scripts/community.mjs
