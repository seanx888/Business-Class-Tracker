name: Mobile app (Flutter)

on:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
