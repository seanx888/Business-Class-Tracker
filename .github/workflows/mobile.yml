name: Mobile app (Flutter)

# Also runs when the shared sources the app is generated from / tested against change.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'web/core/**'
      - 'config/airport-countries.json'
      - 'test/fixtures/links-cases.json'
      - 'scripts/gen-dart-airlines.mjs'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'web/core/**'
      - 'config/airport-countries.json'
      - 'test/fixtures/links-cases.json'
      - 'scripts/gen-dart-airlines.mjs'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
